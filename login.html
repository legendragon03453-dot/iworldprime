    <main class="login-main">
        <div class="login-container">
            <!-- Login Form -->
            <div id="loginSection">
                <h1 class="login-title">Login</h1>
                
                <form class="login-form">
                    <div class="input-group">
                        <input type="email" id="loginEmail" required placeholder=" ">
                        <label for="loginEmail">Email</label>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="loginPassword" required placeholder=" ">
                        <label for="loginPassword">Senha</label>
                    </div>
                    
                    <button type="submit" class="login-btn">Entrar</button>
                    
                    <div class="login-links" style="display: flex; justify-content: space-between;">
                        <a href="#">Esqueci minha senha</a>
                        <a href="#" id="showRegister" style="color: #fff; font-weight: bold;">Criar conta</a>
                    </div>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerSection" style="display: none;">
                <h1 class="login-title">Cadastre-se</h1>
                
                <form class="login-form">
                    <div class="input-group">
                        <input type="text" id="regName" required placeholder=" ">
                        <label for="regName">Nome</label>
                    </div>
                    <div class="input-group">
                        <input type="email" id="regEmail" required placeholder=" ">
                        <label for="regEmail">Email</label>
                    </div>
                    <div class="input-group">
                        <input type="email" id="regEmailConfirm" required placeholder=" ">
                        <label for="regEmailConfirm">Repetir Email</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="regPassword" required placeholder=" ">
                        <label for="regPassword">Senha</label>
                    </div>
                    
                    <button type="submit" class="login-btn">Cadastrar</button>
                    
                    <div class="login-links" style="display: flex; justify-content: flex-end;">
                        <a href="#" id="showLogin" style="color: #fff; font-weight: bold;">Já tenho uma conta</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Script para fazer o fundo animado seguir o mouse
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            requestAnimationFrame(() => {
                document.documentElement.style.setProperty('--mouse-x', `${x}px`);
                document.documentElement.style.setProperty('--mouse-y', `${y}px`);
            });
        });

        // Lógica de Toggle entre Login e Cadastro
        const loginSection = document.getElementById('loginSection');
        const registerSection = document.getElementById('registerSection');
        const showRegisterBtn = document.getElementById('showRegister');
        const showLoginBtn = document.getElementById('showLogin');

        showRegisterBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginSection.style.display = 'none';
            registerSection.style.display = 'block';
        });

        showLoginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            registerSection.style.display = 'none';
            loginSection.style.display = 'block';
        });

        // Lógica de Autenticação com Supabase
        const loginBtn = document.querySelector('#loginSection .login-btn');
        const registerBtn = document.querySelector('#registerSection .login-btn');

        loginBtn.addEventListener('click', async (e) => {
            e.preventDefault(); 
            const email = document.querySelector('#loginSection input[type="email"]').value;
            const password = document.querySelector('#loginSection input[type="password"]').value;

            if(!email || !password) {
                alert('Preencha email e senha!');
                return;
            }

            loginBtn.textContent = "Entrando...";
            
            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Erro no login: ' + error.message);
                loginBtn.textContent = "Entrar";
            } else {
                window.location.href = 'clientes';
            }
        });

        registerBtn.addEventListener('click', async (e) => {
            e.preventDefault(); 
            const name = document.querySelectorAll('#registerSection input[type="text"]')[0].value;
            const emailInputs = document.querySelectorAll('#registerSection input[type="email"]');
            const email = emailInputs[0].value;
            const emailConfirm = emailInputs[1].value;
            const password = document.querySelector('#registerSection input[type="password"]').value;

            if(email !== emailConfirm) {
                alert('Os emails não coincidem!');
                return;
            }

            registerBtn.textContent = "Cadastrando...";

            const { data, error } = await window.supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: name
                    }
                }
            });

            if (error) {
                alert('Erro no cadastro: ' + error.message);
                registerBtn.textContent = "Cadastrar";
            } else {
                alert('Cadastro realizado com sucesso! Verifique seu e-mail ou faça login.');
                registerSection.style.display = 'none';
                loginSection.style.display = 'block';
                registerBtn.textContent = "Cadastrar";
            }
        });
    </script>
