<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Restrito - Admin</title>
    <link rel="stylesheet" href="admin-style.css?v=2">
    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-5" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        .admin-login-box {
            width: 100%;
            max-width: 400px;
            background: rgba(10, 20, 30, 0.9);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="admin-body">
    <div class="admin-login-wrapper">
        <div class="admin-login-box">
            <img src="/IMAGES/LOGO%20WORLD.webp" alt="iWorld Prime" style="max-width: 200px; margin-bottom: 30px;">
            <h2 style="margin-bottom: 10px;">Área Restrita</h2>
            <p style="color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 30px;">Acesso apenas para equipe autorizada.</p>
            
            <form id="adminLoginForm">
                <div class="admin-form-group" style="text-align: left;">
                    <label>E-mail Corporativo</label>
                    <input type="email" id="adminEmail" required placeholder="ex: sac@iworldprime.com.br">
                </div>
                <div class="admin-form-group" style="text-align: left;">
                    <label>Senha</label>
                    <input type="password" id="adminPass" required placeholder="••••••••">
                </div>
                <button type="submit" class="admin-btn primary" style="width: 100%; justify-content: center; margin-top: 10px;">Entrar no Painel</button>
            </form>
            <p id="loginError" style="color: #ff4d4d; font-size: 14px; margin-top: 15px; display: none;">Credenciais inválidas.</p>
        </div>
    </div>

    <script>
        // Nenhum segredo aqui. A conferência de e-mail e senha acontece em
        // /api/admin-login, e o navegador recebe apenas um token de sessão
        // assinado pelo servidor, com validade de 12 horas.
        //
        // A versão anterior comparava o hash da senha contra um valor escrito
        // neste arquivo — que é público. Copiar esse hash dava acesso de
        // escrita à loja sem saber a senha.
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const erro = document.getElementById('loginError');
            const botao = e.target.querySelector('button[type="submit"]');
            erro.style.display = 'none';
            if (botao) { botao.disabled = true; botao.textContent = 'Entrando...'; }

            try {
                const r = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('adminEmail').value,
                        senha: document.getElementById('adminPass').value
                    })
                });

                if (!r.ok) {
                    erro.textContent = r.status === 401
                        ? 'E-mail ou senha inválidos.'
                        : 'Não foi possível entrar. Tente novamente.';
                    erro.style.display = 'block';
                    return;
                }

                const dados = await r.json();
                localStorage.setItem('adminUser', JSON.stringify({
                    name: dados.nome,
                    role: dados.role,
                    token: dados.token,
                    expira: Date.now() + dados.expiraEm
                }));
                window.location.href = 'admin';
            } catch (err) {
                erro.textContent = 'Falha de rede. Verifique sua conexão.';
                erro.style.display = 'block';
            } finally {
                if (botao) { botao.disabled = false; botao.textContent = 'Entrar'; }
            }
        });
    </script>
</body>
</html>
