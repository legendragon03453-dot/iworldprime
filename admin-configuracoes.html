<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Admin iworldprime</title>
    <link rel="stylesheet" href="admin-style.css?v=2">
    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-5" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="admin-auth.js?v=4"></script>
    <script src="admin-sidebar.js?v=4"></script>
</head>
<body class="admin-body" style="display: none;">

    <!-- Sidebar será injetada aqui -->
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
        <header class="admin-header">
            <h1 class="admin-title">Configurações do Site (Acesso CEO)</h1>
            <button class="admin-btn primary" onclick="alert('Configurações salvas no cache!')"><i class="fa-solid fa-floppy-disk"></i> Salvar Tudo</button>
        </header>

        <div class="admin-grid-3" style="grid-template-columns: 1fr 1fr;">
            
            <div class="admin-card">
                <h3>Meu Perfil (James)</h3>
                <hr style="border:0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                <form>
                    <div class="admin-form-group">
                        <label>Nome Completo</label>
                        <input type="text" value="James Nobre">
                    </div>
                    <div class="admin-form-group">
                        <label>E-mail Corporativo</label>
                        <input type="email" value="james@iworldprime.com">
                    </div>
                    <div class="admin-form-group">
                        <label>Nova Senha</label>
                        <input type="password" placeholder="Digite para alterar">
                    </div>
                </form>
            </div>

            <div class="admin-card">
                <h3>Informações da Loja</h3>
                <hr style="border:0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                <form>
                    <div class="admin-form-group">
                        <label>Nome da Loja</label>
                        <input type="text" value="iworldprime">
                    </div>
                    <div class="admin-form-group">
                        <label>Favicon do Site (URL)</label>
                        <input type="text" value="https://exemplo.com/favicon.ico">
                    </div>
                    <div class="admin-form-group">
                        <label>Telefone de Contato (WhatsApp)</label>
                        <input type="text" value="(11) 99999-9999">
                    </div>
                    <div class="admin-form-group">
                        <label>CNPJ / CPF</label>
                        <input type="text" placeholder="00.000.000/0000-00">
                    </div>
                </form>
            </div>
            
        </div>
    </main>

</body>
</html>
