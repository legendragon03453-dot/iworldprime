<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Admin iworldprime</title>
    <link rel="stylesheet" href="admin-style.css?v=2">
    <link href="https://fonts.cdnfonts.com/css/helvetica-neue-5" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="admin-auth.js?v=4"></script>
    <script src="admin-sidebar.js?v=4"></script>
    <style>
        .pedido-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .pedido-top { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
        .pedido-nome { font-size:17px; font-weight:700; color:#fff; margin:0; }
        .pedido-data { font-size:12px; color:rgba(255,255,255,0.45); margin-top:2px; }
        .pedido-status { font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; white-space:nowrap; }
        .st-pago { background:rgba(76,175,80,.15); color:#4CAF50; }
        .st-aguardando_pagamento { background:rgba(255,179,0,.15); color:#FFB300; }
        .st-pendente { background:rgba(255,179,0,.15); color:#FFB300; }
        .st-cancelado { background:rgba(224,87,74,.15); color:#e0574a; }
        .pedido-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 22px; margin-top:14px; }
        .pedido-campo .rot { font-size:11px; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:.05em; }
        .pedido-campo .val { font-size:14px; color:#fff; margin-top:2px; word-break:break-word; }
        .pedido-itens { margin-top:14px; border-top:1px solid rgba(255,255,255,0.06); padding-top:12px; }
        .pedido-itens .li { font-size:13px; color:rgba(255,255,255,0.85); padding:3px 0; }
        .pedido-total { font-size:16px; font-weight:700; color:#CEE7E6; margin-top:8px; }
        .wa-btn { display:inline-flex; align-items:center; gap:6px; background:#25D366; color:#fff; text-decoration:none; font-size:12px; font-weight:600; padding:6px 12px; border-radius:20px; margin-top:6px; }
    </style>
</head>
<body class="admin-body" style="display: none;">
    <aside class="admin-sidebar"></aside>
    <main class="admin-main">
        <header class="admin-header">
            <h1 class="admin-title">Pedidos</h1>
            <button class="admin-btn secondary" onclick="carregarPedidos()"><i class="fa-solid fa-rotate"></i> Atualizar</button>
        </header>

        <div class="admin-card">
            <div id="filtroPills" style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;"></div>
            <input type="text" id="buscaPedido" placeholder="Buscar por nome, telefone, e-mail..." style="padding:10px; width:100%; margin-bottom:18px; box-sizing:border-box; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:8px;" oninput="renderPedidos()">
            <div id="pedidosContainer">
                <p style="color:rgba(255,255,255,0.4); text-align:center; padding:24px;">Carregando pedidos...</p>
            </div>
        </div>
    </main>

    <script>
        let TODOS = [];

        function tokenAdmin() {
            try {
                const u = JSON.parse(localStorage.getItem('adminUser') || '{}');
                return u && u.token ? u.token : '';
            } catch (e) { return ''; }
        }

        async function carregarPedidos() {
            const cont = document.getElementById('pedidosContainer');
            cont.innerHTML = '<p style="color:rgba(255,255,255,0.4); text-align:center; padding:24px;">Carregando pedidos...</p>';
            try {
                const r = await fetch('/api/pedidos', { headers: { 'X-Admin-Token': tokenAdmin() }, cache: 'no-store' });
                const data = await r.json();
                if (!r.ok) { cont.innerHTML = `<p style="color:#e0574a; text-align:center; padding:24px;">${data.error || 'Erro ao carregar.'}</p>`; return; }
                TODOS = Array.isArray(data.data) ? data.data : [];
                renderPedidos();
            } catch (e) {
                cont.innerHTML = '<p style="color:#e0574a; text-align:center; padding:24px;">Falha de conexão.</p>';
            }
        }

        function moeda(v) { return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
        const ROTULO = { pago:'PAGO', aguardando_pagamento:'AGUARDANDO PAGAMENTO', pendente:'PENDENTE', cancelado:'CANCELADO' };
        let filtroAtivo = '';
        window.setFiltro = function (s) { filtroAtivo = s; renderPedidos(); };

        function renderPills() {
            const cont = document.getElementById('filtroPills');
            const c = { '': TODOS.length, pago: 0, aguardando_pagamento: 0, pendente: 0, cancelado: 0 };
            TODOS.forEach(p => { c[p.status] = (c[p.status] || 0) + 1; });
            const defs = [
                ['', 'Todos'], ['pago', 'Pagos'],
                ['aguardando_pagamento', 'Não pagaram'], ['pendente', 'Pendentes'], ['cancelado', 'Cancelados']
            ];
            cont.innerHTML = defs.map(([val, lbl]) => {
                const ativo = filtroAtivo === val;
                const cor = ativo ? '#CEE7E6' : 'rgba(255,255,255,0.06)';
                const txt = ativo ? '#000' : '#fff';
                return `<button onclick="setFiltro('${val}')" style="border:none;cursor:pointer;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;background:${cor};color:${txt};">${lbl} <span style="opacity:.7;">(${c[val] || 0})</span></button>`;
            }).join('');
        }

        function renderPedidos() {
            const cont = document.getElementById('pedidosContainer');
            renderPills();
            const busca = (document.getElementById('buscaPedido').value || '').toLowerCase().trim();

            let lista = TODOS.slice();
            if (filtroAtivo) lista = lista.filter(p => p.status === filtroAtivo);
            if (busca) lista = lista.filter(p => ((p.nome||'')+' '+(p.telefone||'')+' '+(p.email||'')+' '+(p.cidade||'')).toLowerCase().includes(busca));

            if (lista.length === 0) {
                cont.innerHTML = '<p style="color:rgba(255,255,255,0.4); text-align:center; padding:24px;">Nenhum pedido encontrado.</p>';
                return;
            }

            cont.innerHTML = lista.map(p => {
                const data = p.criado_em ? new Date(p.criado_em).toLocaleString('pt-BR') : '';
                const itens = Array.isArray(p.itens) ? p.itens : [];
                const wa = (p.telefone||'').replace(/\D/g,'');
                const waLink = wa ? `https://wa.me/55${wa}` : '';
                const endereco = [p.endereco, p.numero, p.complemento, p.bairro].filter(Boolean).join(', ');
                const cidUf = [p.cidade, p.estado].filter(Boolean).join(' - ');

                // Recuperação de carrinho: pedidos NÃO pagos com link do Mercado Pago.
                // Manda no WhatsApp uma mensagem pronta + o link pra finalizar o pagamento.
                const naoPago = (p.status === 'aguardando_pagamento' || p.status === 'pendente');
                let recuperar = '';
                if (naoPago && wa && p.mp_preference_id) {
                    const linkPag = `https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=${p.mp_preference_id}`;
                    const primeiroNome = (p.nome || '').split(' ')[0] || 'tudo bem';
                    const nomesItens = itens.map(it => `${it.quantidade||1}x ${it.nome}`).join(', ') || 'seu pedido';
                    const msg = `Olá ${primeiroNome}! Aqui é da iWorld Prime. Vi que você começou a compra (${nomesItens}) mas o pagamento não foi concluído. É rapidinho e 100% seguro — é só finalizar por aqui: ${linkPag}`;
                    const waMsg = `https://wa.me/55${wa}?text=${encodeURIComponent(msg)}`;
                    recuperar = `<a href="${waMsg}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:9px 16px;border-radius:22px;"><i class="fa-brands fa-whatsapp"></i> Recuperar carrinho (cobrar no WhatsApp)</a>`;
                }

                return `
                <div class="pedido-card">
                    <div class="pedido-top">
                        <div>
                            <p class="pedido-nome">${esc(p.nome) || 'Sem nome'}</p>
                            <div class="pedido-data">${esc(data)} · #${esc((p.id||'').slice(0,8))}</div>
                        </div>
                        <span class="pedido-status st-${esc(p.status)}">${ROTULO[p.status] || esc(p.status)}</span>
                    </div>
                    <div class="pedido-grid">
                        <div class="pedido-campo"><div class="rot">WhatsApp / Tel</div><div class="val">${esc(p.telefone) || '—'}${waLink ? ` <a class="wa-btn" href="${waLink}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> Chamar</a>` : ''}</div></div>
                        <div class="pedido-campo"><div class="rot">E-mail</div><div class="val">${esc(p.email) || '—'}</div></div>
                        <div class="pedido-campo"><div class="rot">CEP</div><div class="val">${esc(p.cep) || '—'}</div></div>
                        <div class="pedido-campo"><div class="rot">Endereço</div><div class="val">${esc(endereco) || '—'}</div></div>
                        <div class="pedido-campo"><div class="rot">Cidade / UF</div><div class="val">${esc(cidUf) || '—'}</div></div>
                    </div>
                    <div class="pedido-itens">
                        ${itens.map(it => `<div class="li">${it.quantidade||1}x ${esc(it.nome)} — ${moeda(it.preco)}</div>`).join('') || '<div class="li">—</div>'}
                        <div class="pedido-total">Total: ${moeda(p.total)}</div>
                        ${recuperar ? `<div style="margin-top:14px;">${recuperar}</div>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        document.addEventListener('DOMContentLoaded', carregarPedidos);
    </script>
</body>
</html>
